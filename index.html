<html lang="pt-BR">
<head>

<title>Central da Gestão — Reserva Imob BC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231f9d67%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2217%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22700%22%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE: painel de trabalho do gestor comercial, direto e sóbrio
   IDEA: a prancheta de gestão da Reserva Imob — tudo do dia numa mesa só
   PICTURE: o próprio painel (tarefas, registro do dia, carteira de corretores)
   COLOUR and TYPE: azul-marinho e verde da marca Reserva; Inter Tight + Inter
   LAYOUT: barra de abas fixa, faixa de números do dia, duas colunas que empilham no celular */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f9,#0c1522);--card:light-dark(#fff,#13203200);--panel:light-dark(#fff,#132033);
--ink:light-dark(#122033,#e7edf5);--mute:light-dark(#5b6b80,#93a3b8);--line:light-dark(#dfe5ee,#22324a);
--navy:#10294a;--navy2:light-dark(#10294a,#1b3d6b);--green:#1f9d67;--greenbg:light-dark(#e4f5ec,#123a2a);
--red:#c93c3c;--redbg:light-dark(#fbe9e9,#3a1717);--amber:light-dark(#9a6a00,#e2b23e);--soft:light-dark(#eef2f7,#1a2a40)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(22px,3vw,30px)}h2{font-size:19px}h3{font-size:16px}
a{color:var(--green)}
header{background:var(--navy);color:#fff;padding:14px max(4vw,14px) 0;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:8px;background:var(--green);display:grid;place-items:center;font:700 15px "Inter Tight"}
.brand small{display:block;color:#a9bbd3;font-size:12.5px}
.sync{font-size:12.5px;color:#a9bbd3}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav a{flex:none;color:#c9d6e6;text-decoration:none;padding:10px 14px;border-radius:8px 8px 0 0;font-weight:500;font-size:14.5px}
nav a.on{background:var(--bg);color:var(--ink)}
main{padding:20px max(4vw,14px) 60px;max-width:1320px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0 18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi{overflow:hidden}.kpi b{display:block;font:700 clamp(19px,2.1vw,25px)/1.15 "Inter Tight";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.kpi b small{font-size:.6em}
.kpi span{color:var(--mute);font-size:13px;display:block;margin-top:2px}td.num{font-variant-numeric:tabular-nums}.kpi.alert b{color:var(--red)}.kpi.ok b{color:var(--green)}
.mute{color:var(--mute)}.sm{font-size:13px}
.btn{font:600 14px Inter;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 14px;min-height:40px;cursor:pointer}
.btn:hover{border-color:var(--green)}.btn.pri{background:var(--green);border-color:var(--green);color:#fff}.btn.dk{background:var(--navy2);border-color:var(--navy2);color:#fff}
.btn.mini{min-height:32px;padding:4px 10px;font-size:13px}.btn.del{color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,select,textarea{font:16px Inter;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:74px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}.task input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--green)}
.task .t{font-weight:600}.task.done .t{text-decoration:line-through;color:var(--mute)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap;margin-right:4px}
.tag.A{background:var(--redbg);color:var(--red)}.tag.late{background:var(--redbg);color:var(--red)}.tag.g{background:var(--greenbg);color:var(--green)}
.col{background:var(--soft);border-radius:12px;padding:12px;min-height:200px}
.col h3{margin-bottom:8px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer}
.card:hover{border-color:var(--green)}
.broker{cursor:pointer}.broker .nm{font:700 16px "Inter Tight"}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font:700 14px "Inter Tight";flex:none}
.meter{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--green)}
.list{margin:6px 0 0;padding-left:18px}.list li{margin:3px 0}
.chk{list-style:none;padding:0}.chk li{display:flex;gap:8px;align-items:flex-start}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl div{margin-bottom:10px;position:relative}
.tl div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--green)}
table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--mute);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);padding:8px 6px}
td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--mute)}
.bars i{display:block;width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
dialog{border:0;border-radius:14px;padding:0;width:min(720px,94vw);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0a1220aa}
.dh{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.db{padding:6px 18px 18px;max-height:72vh;overflow:auto}.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.rows td{padding:3px}.rows input{padding:6px 8px;font-size:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:20;display:none;max-width:92vw}
#toast a{color:#7fe0b3}
.banner{background:var(--redbg);color:var(--red);padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}
.empty{color:var(--mute);padding:14px 0;font-size:14px}
.section-t{margin:22px 0 10px}
pre.note{white-space:pre-wrap;font:14px/1.55 Inter;margin:6px 0 0}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.f2{grid-template-columns:minmax(0,1fr)}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s}}
#login{position:fixed;inset:0;z-index:50;background:var(--navy);display:none;place-items:center;padding:20px}
#login form{background:var(--panel);color:var(--ink);border-radius:14px;padding:26px;width:min(380px,100%);box-shadow:0 10px 40px #0005}
#login h2{margin:10px 0 4px}#login label{display:block;margin:12px 0 4px;font-weight:600;font-size:13px}
#login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
#login button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--green);color:#fff;font:600 15px Inter}
#login .lk{background:none;color:var(--mute);margin-top:8px;font-weight:500;font-size:13px}
.who{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#a9bbd3}.who button{background:#ffffff1a;color:#fff;border:0;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="js/shim.js"></script>

<body>
<header>
 <div class="top">
  <div class="brand"><div class="logo">R</div><div><h1 style="font-size:19px">Central da Gestão — Fernando</h1><small>Reserva Imob · Gestão Comercial BC</small></div></div>
  <div class="who"><span class="sync" id="sync">Conectando…</span><span id="whoName"></span><button type="button" data-act="logout">Sair</button></div>
 </div>
 <nav id="nav">
  <a href="#hoje">Hoje</a><a href="#cobrancas">Cobranças</a><a href="#tarefas">Tarefas</a><a href="#diario">Diário</a><a href="#corretores">Corretores</a><a href="#reunioes">Reuniões</a><a href="#crm">CRM</a><a href="#vendas">Vendas</a><a href="#empresa">Empresa</a>
 </nav>
</header>
<div id="login"><form autocomplete="on"><div class="logo" style="color:#fff">R</div><h2>Central da Gestão</h2><div class="mute sm">Reserva Imob · Gestão Comercial BC</div>
<label for="lgEmail">E-mail</label><input id="lgEmail" type="email" autocomplete="username" required>
<label for="lgPass">Senha</label><input id="lgPass" type="password" autocomplete="current-password" required>
<button type="submit">Entrar</button><button type="button" class="lk" id="lgForgot">Esqueci a senha</button><p id="lgMsg" class="sm" style="color:var(--red);min-height:1em"></p></form></div>
<main id="main"><p class="empty">Carregando…</p></main>
<dialog id="dlg"><div class="dh"><h3 id="dlgT"></h3><button class="btn mini" data-act="close" aria-label="Fechar">✕</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>
<div id="toast"></div>
<script>
{
const COLS=['tarefas','diario','corretores','reunioes','vendas','docs','config','crm','clientes','captacoes','cobrancas'];
const S={};COLS.forEach(c=>S[c]=[]);
const drafts={};let tDia='';let dict=null,smp=null;const voice={state:'idle',prev:null,busy:false,err:''};let db=null,mode='loading',view='hoje',sel=null,filt={st:'',cat:'',cor:'',q:''},rtipo='';
const CATS=['1:1','Vitrine','Visita a obra','Agenciamento','Placa','Exclusividade','Leads/Funil','Treinamento','OPS/KPIs','Recrutamento','Plantões','Marketing','Administrativo','Outro'];
const TIPOS=['1:1','Reunião do time','OPS Semanal','Liderança','Treinamento','Construtora/Parceiro','Outra'];
const DEF_PASTA='1ACmztLncbs0XjjYmBHUfjGnAMwWFB8Da';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});
const fd=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const capUse=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
const brlC=n=>{n=+n||0;const a=Math.abs(n);if(a>=1e6)return 'R$ '+(n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:a>=1e8?0:2})+' mi';if(a>=1e4)return 'R$ '+Math.round(n/1e3).toLocaleString('pt-BR')+' mil';return brl(n)};
const mes=m=>{const n=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return m?n[+m.slice(5,7)-1]+'/'+m.slice(2,4):''};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const cfg=()=>S.config.find(c=>c.id==='geral')||{};
const cor=id=>S.corretores.find(c=>c.id===id);
const corNome=id=>cor(id)?.nome||({alan:'Alan (gestão)',luiz:'Luiz (diretoria)'}[id]||'');
const ini=n=>n.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const folderId=u=>{const m=String(u||'').match(/folders\/([\w-]+)/);return m?m[1]:(u&&/^[\w-]{20,}$/.test(u)?u:'')};

function toast(msg,url){const t=$('#toast');t.innerHTML=esc(msg)+(url?` · <a href="${esc(url)}" target="_blank" rel="noopener">abrir</a>`:'');t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',url?9000:3500)}

/* ---------- dados ---------- */
function expandCap(a){const out=[];a.forEach(d=>{if(!Array.isArray(d.itens)){out.push(d);return}d.itens.forEach(x=>{let[ref,nome,tipo,valor,regiao,site,at,fl]=x;fl=fl||'';out.push({id:d.id+'-'+ref,titulo:nome+' · ref '+ref,ref,corretor:d.corretor||'',corretorNome:d.corretorNome||'',tipo,valor:+valor||0,regiao,site:!!site,atualizacao:at,desatualizada:['60','61','+61'].includes(String(at)),proposta:fl.includes('P'),placa:fl.includes('L'),co:fl.includes('C')?(d.co||''):'',obs:fl.includes('X')?'Valor cadastrado no Loft parece errado: conferir':'',status:'Ativa'})})});return out}
function localLoad(){try{const j=JSON.parse(localStorage.getItem('crmFP')||'{}');COLS.forEach(c=>S[c]=j[c]||[]);S.captacoes=expandCap(S.captacoes)}catch(e){}}
function localSave(){try{localStorage.setItem('crmFP',JSON.stringify(S))}catch(e){}}
async function save(c,obj){const id=obj.id||uid();const data={...obj};delete data.id;data.upd=new Date().toISOString();
 if(db){try{await db.collection(c).doc(id).set(data)}catch(e){toast(e.code==='quota_exceeded'?'Espaço do banco cheio':'Não salvou: '+(e.message||e.code));return}}
 else{const a=S[c];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]={id,...data};else a.push({id,...data});localSave();render()}
 return id}
async function del(c,id){if(db){try{await db.collection(c).doc(id).delete()}catch(e){toast(e.message||'Não excluiu');}}else{S[c]=S[c].filter(x=>x.id!==id);localSave();render()}}
async function boot(){
 const t=setTimeout(()=>{if(mode==='loading'){$('#sync').textContent='Sem resposta do banco ainda…'}},10000);
 db=await claude.use('db').catch(()=>null);
 if(!db){clearTimeout(t);mode='local';localLoad();$('#sync').textContent='Modo local (sem sincronizar)';render();return}
 let got=0;
 COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(c==='captacoes')S.captacoes=expandCap(S.captacoes);if(!s.metadata.fromCache){got++;if(got>=COLS.length){clearTimeout(t);mode='db';$('#sync').textContent='Sincronizado ✓'}}render()},e=>{clearTimeout(t);$('#sync').textContent='Erro no banco: '+e.code}));
}

/* ---------- cálculos ---------- */
function prevDay(d){const ds=[...new Set([...S.tarefas.map(t=>t.feito),...S.diario.map(x=>x.id)].filter(x=>x&&x<d))].sort();return ds.pop()||new Date(new Date(d+'T12:00:00')-864e5).toISOString().slice(0,10)}
function doneOn(d){return S.tarefas.filter(t=>t.feito===d).sort((a,b)=>(a.upd||'').localeCompare(b.upd||''))}
function consol(d){const ts=doneOn(d),pv=prevDay(d),tp=doneOn(pv),pend=openTasks().filter(t=>t.prazo&&t.prazo<=d);const it=t=>`<li><b>${esc(t.titulo)}</b>${t.cat?` <span class="tag">${esc(t.cat)}</span>`:''}${t.corretor?`<span class="tag">${esc(corNome(t.corretor))}</span>`:''}${t.notas?`<div class="sm mute">${esc(t.notas)}</div>`:''}</li>`;
 return `<div style="background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px"><div class="row sp"><b>Realizado em ${fd(d)} — ${ts.length} tarefa${ts.length===1?'':'s'}</b><a href="#tarefas" class="sm" data-act="goT" data-d="${d}">+ registrar tarefa</a></div>${ts.length?`<ul class="list">${ts.map(it).join('')}</ul>`:'<p class="empty" style="padding:6px 0">Nenhuma tarefa registrada como feita neste dia. Registre na aba Tarefas.</p>'}
 <details style="margin-top:6px"><summary class="sm" style="cursor:pointer">Dia anterior (${fd(pv)}) — ${tp.length} tarefas concluídas · ${pend.length} pendências seguem</summary>${tp.length?`<ul class="list">${tp.map(it).join('')}</ul>`:''}${pend.length?`<div class="sm" style="margin-top:6px"><b>Pendências com prazo até ${fd(d)}:</b></div><ul class="list sm">${pend.map(t=>`<li>${esc(t.titulo)} (${fd(t.prazo)})</li>`).join('')}</ul>`:''}</details></div>`}
function openTasks(){return S.tarefas.filter(t=>t.status!=='done')}
function lastMeet(id){return S.reunioes.filter(r=>r.corretor===id&&r.tipo==='1:1').map(r=>r.data).sort().pop()}
/* ---------- vendas ---------- */
const VTIPOS=['Terceiros','Lançamento','Construtora (pronto)','Outro'];
const vlvOf=v=>{const c=+v.comissao||0;if(c>0)return c/(v.tipo==='Terceiros'?0.06:0.05);return +v.vgv||0};
const vMes=v=>(v.data||'').slice(0,7);
function metaMes(m){const c=cfg(),mm=c.metasVLV||{};return +mm[m]||0}
function mesRow(m){const vs=S.vendas.filter(v=>vMes(v)===m&&v.status!=='Distrato'),h=(cfg().historico||{})[m];const itemV=vs.reduce((s,v)=>s+vlvOf(v),0),itemG=vs.reduce((s,v)=>s+(+v.vgv||0),0);
 const useH=h&&!vs.length;return{m,meta:metaMes(m),vlv:useH?(+h.vlv||0):itemV,vgv:useH?(+h.vgv||0):itemG,n:useH?(+h.vendas||0):vs.length,fonte:useH?(h.fonte||'histórico'):(vs.length?'contratos lançados':''),nota:h&&h.nota||'',vs}}
function anoRows(y){return [...Array(12)].map((_,i)=>mesRow(y+'-'+String(i+1).padStart(2,'0')))}
let vAno='2026',vSel='';
function vendaRow(v){const sem=!(+v.vgv);return `<tr class="click" data-act="editV" data-id="${v.id}"><td style="white-space:nowrap">${fd(v.data)}</td><td>${esc(corNome(v.corretor)||v.corretorNome||'')}</td><td>${esc(v.emp)} <span class="mute sm">${esc(v.unidade||'')}</span></td><td>${esc(v.tipo||'')}</td><td class="num">${sem?'<span class="tag late">conferir</span>':brl(v.vgv)}</td><td class="num">${brl(vlvOf(v))}</td><td>${v.link?`<a href="${esc(v.link)}" target="_blank" rel="noopener" data-act="nop">contrato</a>`:''}</td></tr>`}

 <div class="kpis"><div class="kpi ${vlv>=metaAno*(ytd.length/12)?'ok':''}"><b>${brlC(vlv)}</b><span>VLV no ano · ${(vlv/metaAno*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}% da meta de ${brlC(metaAno)}</span><div class="meter"><i style="width:${Math.min(100,vlv/metaAno*100)}%"></i></div></div><div class="kpi"><b>${brlC(vgv)}</b><span>VGV registrado</span></div><div class="kpi"><b>${n}</b><span>vendas no ano</span></div><div class="kpi"><b>${n?brlC(vgv/n):'—'}</b><span>ticket médio</span></div><div class="kpi ${cur.vlv>=cur.meta&&cur.meta?'ok':''}"><b>${brlC(cur.vlv)}</b><span>VLV de ${mes(sel)} · meta ${brlC(cur.meta)}</span></div></div>

 <section class="box"><h3>Ranking ${y} (VLV)</h3>${rk.length?rk.map(([k,x])=>`<div style="margin:10px 0"><div class="row sp sm"><b>${esc(k)}</b><span>${x.n} venda${x.n===1?'':'s'} · ${brlC(x.l)}</span></div><div class="meter"><i style="width:${x.l/rmx*100}%"></i></div></div>`).join(''):'<p class="empty">Sem vendas lançadas.</p>'}

 form('Metas e histórico '+vAno,[{k:'metaAno',l:'Meta anual de VLV (R$)',t:'number',full:1},{k:'rows',l:'Por mês',t:'rows',c:[{k:'m',l:'Mês',w:80},{k:'meta',l:'Meta VLV',t:'number',w:110},{k:'vlv',l:'VLV histórico',t:'number',w:110},{k:'vgv',l:'VGV histórico',t:'number',w:110},{k:'vendas',l:'Nº vendas',t:'number',w:60},{k:'nota',l:'Nota',w:160}]}],{metaAno:c.metaAno||100000000,rows:ms.map(m=>({m,meta:mm[m]||0,vlv:h[m]?.vlv||'',vgv:h[m]?.vgv||'',vendas:h[m]?.vendas||'',nota:h[m]?.nota||''}))},async o=>{const nm={...mm},nh={...h};o.rows.forEach(r=>{if(!/^\d{4}-\d{2}$/.test(r.m))return;nm[r.m]=+r.meta||0;if(r.vlv||r.vgv||r.vendas||r.nota)nh[r.m]={vlv:+r.vlv||0,vgv:+r.vgv||0,vendas:+r.vendas||0,nota:r.nota||'',fonte:(h[r.m]&&h[r.m].fonte)||'histórico'};else delete nh[r.m]});await save('config',{...c,id:'geral',metaAno:o.metaAno,metasVLV:nm,historico:nh});close()})}

const PLANO={faixas:[{vlv:0,p:40,b:0},{vlv:10e6,p:45,b:500},{vlv:20e6,p:50,b:1000},{vlv:40e6,p:55,b:2000},{vlv:60e6,p:60,b:3000}],
 premio:[{min:120e6,t:'Viagens de R$ 15 mil / 10 mil / 5 mil (1º ao 3º)'},{min:150e6,t:'Viagens de R$ 30 mil / 20 mil / 10 mil'},{min:200e6,t:'Supermeta: viagens de R$ 30/20/10 mil + cheque de R$ 30/20/10 mil'}],link:'https://drive.google.com/file/d/1FOMTheBdyuRwYa_W0OYZH90hCrHW4n9G/view'};
const bonusVenda=g=>!(+g)?0:g<=1e6?300:g<=2e6?500:1000;
const faixaDe=v=>{let f=PLANO.faixas[0];PLANO.faixas.forEach(x=>{if(v>=x.vlv)f=x});return f};
const prox=v=>PLANO.faixas.find(x=>x.vlv>v);
const comPct=v=>(+v.vgv&&+v.comissao)?(+v.comissao/+v.vgv*100):null;
const extraOk=v=>{const p=comPct(v);if(p==null)return null;return p>=(v.tipo==='Terceiros'?6:5)};
function vPlano(y,sel,vlvAno){const vs=S.vendas.filter(v=>(v.data||'').startsWith(y)&&v.status!=='Distrato');const by={};
 vs.forEach(v=>{const k=v.corretor||'outro';(by[k]=by[k]||[]).push(v)});
 const rows=Object.entries(by).filter(([k])=>cor(k)).map(([k,a])=>{const l=a.reduce((s,v)=>s+vlvOf(v),0),f=faixaDe(l),n=prox(l);return{k,nome:corNome(k),l,f,n,bon:a.reduce((s,v)=>s+bonusVenda(+v.vgv),0),qt:a.length}}).sort((a,b)=>b.l-a.l);
 const ms=vs.filter(v=>vMes(v)===sel);const camp=ms.slice().sort((a,b)=>vlvOf(b)-vlvOf(a))[0];
 const tgt=PLANO.premio.find(p=>vlvAno<p.min)||PLANO.premio[PLANO.premio.length-1];
 return `<section class="box" style="margin-top:16px"><div class="row sp"><h3>Plano de carreira, bonificações e premiações 2026</h3><a class="sm" href="${PLANO.link}" target="_blank" rel="noopener">ver o plano completo (PDF)</a></div>
 <div class="grid2" style="margin-top:10px"><div>
 <h3 class="section-t" style="margin-top:4px">Faixa de comissionamento por corretor</h3><p class="sm mute">Pelo VLV acumulado lançado aqui. Base 40% (venda) e 10% (agenciamento); sobe a 45% com R$ 10 mi, 50% com 20 mi, 55% com 40 mi e 60% com 60 mi, com bônus extra de Meta Ads válido por 12 meses.</p>
 ${rows.length?`<div class="scroll"><table class="stack"><thead><tr><th>Corretor</th><th class="num">VLV acumulado</th><th>Faixa</th><th>Próxima faixa</th><th class="num">Bônus Meta Ads (vendas)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.nome)}</td><td class="num">${brlC(r.l)}</td><td><span class="tag g">${r.f.p}%</span></td><td class="sm">${r.n?`faltam ${brlC(r.n.vlv-r.l)} para ${r.n.p}% (+R$ ${r.n.b.toLocaleString('pt-BR')} Meta Ads)`:'faixa máxima'}</td><td class="num">${brlC(r.bon)}<div class="sm mute">${r.qt} venda${r.qt===1?'':'s'}</div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nenhuma venda de corretor lançada.</p>'}
 <p class="sm mute">Bônus mensal por venda (só para Meta Ads): até R$ 1 mi → R$ 300; R$ 1 a 2 mi → R$ 500; acima de R$ 2 mi → R$ 1.000. Premiação extra de 100% para o corretor quando a comissão mínima é atingida: 5% em lançamentos, 6% em avulsos.</p></div>
 <div><h3 class="section-t" style="margin-top:4px">Campeão de vendas de ${mes(sel)}</h3>${camp?`<div class="card" data-act="editV" data-id="${camp.id}"><b>${esc(corNome(camp.corretor)||'—')}</b> · ${esc(camp.emp)} ${esc(camp.unidade||'')}<div class="sm">VGV ${+camp.vgv?brlC(camp.vgv):'a conferir'} · VLV ${brlC(vlvOf(camp))}</div><div class="sm" style="margin-top:4px">${+camp.vgv>=2e6?'<span class="tag g">Leva R$ 500 Meta Ads + vaga de garagem</span>':'<span class="tag">Vaga de garagem exige venda a partir de R$ 2 mi</span>'}</div></div>`:'<p class="empty">Sem vendas no mês.</p>'}
 <p class="sm mute">Campeão de captações do mês: R$ 250 para Meta Ads (acompanhar pelo KPIS_BC).</p>
 <h3 class="section-t">Bônus de Meta Ads das vendas de ${mes(sel)}</h3>${ms.length?ms.map(v=>{const e=extraOk(v);return `<div class="row sp sm" style="padding:5px 0;border-bottom:1px solid var(--line)"><span>${esc(corNome(v.corretor)||'—')} · ${esc(v.emp)}</span><span>${+v.vgv?brlC(bonusVenda(+v.vgv)):'VGV a conferir'}${e===true?' <span class="tag g">extra 100%</span>':e===false?' <span class="tag">abaixo do mínimo</span>':''}</span></div>`}).join(''):'<p class="empty">—</p>'}
 <h3 class="section-t">Premiação Campeões 2026 (VLV da Reserva BC)</h3>
 ${PLANO.premio.map(p=>`<div style="margin:8px 0"><div class="row sp sm"><b>${brlC(p.min)}</b><span>${Math.min(100,vlvAno/p.min*100).toFixed(0)}%</span></div><div class="meter"><i style="width:${Math.min(100,vlvAno/p.min*100)}%"></i></div><div class="sm mute">${esc(p.t)}</div></div>`).join('')}
 <p class="sm">${vlvAno<tgt.min?`Faltam <b>${brlC(tgt.min-vlvAno)}</b> de VLV para a faixa de ${brlC(tgt.min)}.`:'Supermeta atingida.'}</p>

 const cb=S.cobrancas.filter(c=>c.d>=d1&&c.d<=d2);if(cb.length){const nc=new Set(cb.map(c=>c.cor)).size;it.push({k:'b1',g:'Cobranças ao time',txt:`${cb.filter(c=>c.status==='cobrado').length} pontos cobrados e ${cb.filter(c=>c.status==='resolvido').length} resolvidos, com ${nc} corretores`,det:''})}

 ETAPAS.forEach(e=>st.etapas[e]=o.filter(c=>c.etapa===e).length);
 o.forEach(c=>{if(c.etapa==='Leads'&&c.entrada&&days(c.entrada,d)>=1)st.leadsParados++;if(!c.proxAtiv)st.semProx++;else if(c.proxAtiv<d)st.vencidas++;if(!c.ultAtual||days(c.ultAtual,d)>7)st.semAtual7++;if(!c.anotado)st.nunca++});
 st.pctParado=o.length?Math.round(st.semAtual7/o.length*100):0;

async function organize(){const txt=(document.getElementById('vTxt')?.value||'').trim();if(!txt){voice.err='Grave ou escreva o que você fez.';return render()}

 voice.busy=true;voice.err='';render();const d=tDia||today();

 const prompt=`Você organiza o registro diário de atividades de Fernando, gerente comercial da imobiliária Reserva Imob em Balneário Camboriú. Abaixo está a transcrição de um áudio em que ele conta o que fez no dia ${fd(d)}.

const clean=s=>String(s??'').replace(/[—–]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[•●]/g,'-').replace(/…/g,'...').replace(/✓/g,'OK').replace(/[^\x00-\xFF]/g,'');
function mkPdf(title,sub,blocks){if(!window.jspdf){toast('Biblioteca de PDF não carregou');return null}const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});const W=210,M=15,CW=W-2*M;let y=0;

  if(b.kpi){need(20);const n=b.kpi.length,w=(CW-(n-1)*3)/n;b.kpi.forEach(([v,l],i)=>{const x=M+i*(w+3);d.setFillColor(238,242,247);d.roundedRect(x,y,w,16,2,2,'F');d.setFont('helvetica','bold');d.setFontSize(12);d.text(clean(v),x+3,y+7);d.setFont('helvetica','normal');d.setFontSize(7.5);d.setTextColor(90,105,125);d.text(clean(l),x+3,y+12.5);d.setTextColor(25,35,50)});y+=21}
  if(b.p!=null){d.setFont('helvetica','normal');d.setFontSize(10);const L=d.splitTextToSize(clean(b.p||'-'),CW);L.forEach(l=>{need(5);d.text(l,M,y);y+=4.6});y+=2}
  if(b.li){d.setFont('helvetica','normal');d.setFontSize(10);if(!b.li.length){need(5);d.text('-',M,y);y+=5}b.li.forEach(s=>{const L=d.splitTextToSize(clean(s),CW-6);L.forEach((l,i)=>{need(5);if(!i)d.text('-',M+1,y);d.text(l,M+5,y);y+=4.6})});y+=2}
  if(b.kv){d.setFontSize(10);b.kv.forEach(([k,v])=>{const L=d.splitTextToSize(clean(v||'-'),CW-48);need(5*L.length);d.setFont('helvetica','bold');d.text(clean(k),M,y);d.setFont('helvetica','normal');L.forEach((l,i)=>d.text(l,M+48,y+i*4.6));y+=4.6*L.length+1.4})}
  if(b.tb){const{c,w,r}=b.tb;const tw=w.reduce((a,x)=>a+x,0),ws=w.map(x=>x/tw*CW);const row=(cells,bold)=>{d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(bold?8.5:9);const Ls=cells.map((v,i)=>d.splitTextToSize(clean(v),ws[i]-2));const h=Math.max(...Ls.map(l=>l.length))*4.2+2.4;need(h);if(bold){d.setFillColor(16,41,74);d.rect(M,y-3.6,CW,h,'F');d.setTextColor(255,255,255)}let x=M;Ls.forEach((l,i)=>{d.text(l,x+1,y);x+=ws[i]});d.setTextColor(25,35,50);y+=h;d.setDrawColor(220,226,235);d.setLineWidth(.2);if(!bold)d.line(M,y-3.4,M+CW,y-3.4)};row(c,1);if(!r.length)row(['Sem registros'].concat(c.slice(1).map(()=>'')));r.forEach(x=>row(x));y+=3}

 if(A==='newNota')return form('Nota sobre corretor',[{k:'c',l:'Corretor',t:'sel',o:S.corretores.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>[c.id,c.nome])},{k:'tipo',l:'Registrar como',t:'sel',o:[['nota','Nota de inteligência'],['forte','Ponto forte'],['dev','Ponto a desenvolver'],['acao','Ação / combinado'],['fb','Feedback para o próximo 1:1']]},{k:'t',l:'O que você identificou',t:'area'}],{},async o=>{const c=cor(o.c);if(!c||!o.t)return;const u={...c};
  if(o.tipo==='nota')u.notas=[...(c.notas||[]),{d:today(),t:o.t}];if(o.tipo==='forte')u.fortes=[...(c.fortes||[]),o.t];if(o.tipo==='dev')u.desenvolver=[...(c.desenvolver||[]),o.t];if(o.tipo==='acao')u.acoes=[...(c.acoes||[]),{t:o.t,done:false}];if(o.tipo==='fb')u.feedback=((c.feedback||'')+'\n'+o.t).trim();await save('corretores',u);close();toast('Registrado em '+c.nome)});
 if(A==='newV')return vendaForm(el.dataset.c?{data:today(),status:'Assinado',tipo:'Terceiros',corretor:el.dataset.c}:null);
 if(A==='editV')return vendaForm(S.vendas.find(x=>x.id===id));
 if(A==='metas')return metasForm();
 if(A==='vMes'){vSel=el.dataset.m;delete drafts.notaMes;return render()}
 if(A==='saveNotaMes'){const c=cfg(),nm={...(c.notasMes||{})};nm[el.dataset.m]=$('#notaMes').value;delete drafts.notaMes;await save('config',{...c,id:'geral',notasMes:nm});return toast('Leitura do mês salva')}
 if(A==='addVendaOld')return form('Nova venda',[{k:'data',l:'Data',t:'date'},{k:'emp',l:'Empreendimento / unidade'},{k:'vgv',l:'VGV (R$)',t:'number'},{k:'com',l:'Comissão total (R$)',t:'number'}],{data:today()},async o=>{const c=cor(id);await save('corretores',{...c,vendas:[...(c.vendas||[]),o]});close()});
 if(A==='delVenda'){const c=cor(id);return save('corretores',{...c,vendas:c.vendas.filter((_,i)=>i!==+el.dataset.i)})}
 if(A==='newR')return meetForm(el.dataset.c?{data:today(),tipo:'1:1',corretor:el.dataset.c}:null);
 if(A==='editR'){const r=S.reunioes.find(x=>x.id===id);return r&&meetForm(r)}
 if(A==='newDoc')return docForm();if(A==='editDoc')return docForm(S.docs.find(x=>x.id===id));
 if(A==='addRow'){const f=form._f.find(x=>x.k===el.dataset.f);document.querySelector('#ff_'+f.k+' tbody').insertAdjacentHTML('beforeend',rowH(f.c,{elegivel:true}));return}
 if(A==='rmRow')return el.closest('tr').remove();
 if(A==='delX'){if(el.dataset.ok!=='1'){el.dataset.ok='1';el.textContent='Confirmar exclusão';return}await del(el.dataset.c,id);close();if(el.dataset.c==='corretores')sel=null;return render()}

 if(A==='cfg'){const c=cfg();return form('Configurações',[{k:'pasta',l:'Pasta do Drive para relatórios (link ou ID)',full:1},{k:'meta11',l:'Meta de 1:1 no mês',t:'number'}],{pasta:c.pasta||DEF_PASTA,meta11:c.meta11||40},async o=>{await save('config',{...c,id:'geral',pasta:folderId(o.pasta)||DEF_PASTA,meta11:o.meta11});close()})}

document.addEventListener('input',ev=>{if(ev.target.id==='cfq'){cf.q=ev.target.value;render();return}if(ev.target.id==='ldExtra'&&LD){LD.extra=ev.target.value;liderSync();return}if(['dResumo','dReal','dSit','dFb','dProx','fbNext','notaTxt','qT','qN','qC','qK','vTxt','notaMes'].includes(ev.target.id))drafts[ev.target.id]=ev.target.value;const f=ev.target.dataset.f;if(f){filt[f]=ev.target.value;render()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='ldPer'&&LD){return liderDlg(LD.d,t.value)}if(t.id==='cobCor'){cobCor=t.value;return render()}if(t.dataset.cf&&t.id!=='cfq'){cf[t.dataset.cf]=t.value;return render()}if(LD&&t.dataset.ld){LD.sel[t.dataset.ld]=t.checked;return liderSync()}if(t.id==='ldPara'){LD.para=t.value;return liderSync()}if(t.id==='ldDet'){LD.det=t.checked;return liderSync()}if(t.id==='vAno'){vAno=t.value;vSel='';render()}if(t.id==='tDia'){tDia=t.value;render()}if(t.id==='rtipo'){rtipo=t.value;render()}if(t.id==='diaSel'){['dResumo','dReal','dSit','dFb','dProx'].forEach(k=>delete drafts[k]);sel={dia:t.value};render()}if(t.dataset.f&&t.tagName==='SELECT'){filt[t.dataset.f]=t.value;render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='notaTxt'){ev.preventDefault();document.querySelector('[data-act=addNota]').click()}});
function route(){const h=location.hash.slice(1);view=['hoje','cobrancas','tarefas','diario','corretores','reunioes','crm','vendas','empresa'].includes(h)?h:'hoje';if(view!=='corretores'&&view!=='diario')sel=null;render()}
addEventListener('hashchange',()=>{sel=null;route()});
route();
